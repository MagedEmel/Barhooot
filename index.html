<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عشيرة الظلام</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="icon" href="assets/ChatGPT Image Jun 23, 2026, 01_26_16 PM.png" />
  </head>
  <body>
    <div class="vignette"></div>
    <div class="noise"></div>
    <div class="fire-bg">
      <div class="flame"></div>
      <div class="flame"></div>
      <div class="flame"></div>
      <div class="flame"></div>
      <div class="flame"></div>
      <div class="flame"></div>
    </div>

    <div class="wrap">
      <!-- شاشة اختيار الاسم -->
      <section id="screen-select" class="fade-in">
        <h1 class="glitch" data-text="من تكون...؟">من تكون...؟</h1>
        <p class="subtitle">قل اسمك تحت أنظار العشيرة</p>

        <div class="card" style="margin-top: 30px">
          <label class="muted">اسمك</label>
          <input
            list="names-list"
            id="name-input"
            class="input"
            placeholder="اكتب اسمك..."
            autocomplete="off" />
          <datalist id="names-list"></datalist>

          <button id="btn-enter" class="btn" disabled>ادخل إن كنت تجرؤ</button>
          <p
            id="error-msg"
            class="muted hidden"
            style="color: #ff5a5a; text-align: center; margin-top: 10px"></p>
        </div>
      </section>

      <!-- شاشة الرسالة المرعبة -->
      <section id="screen-welcome" class="hidden">
        <div class="card center fade-in" style="margin-top: 60px">
          <p class="muted">صوت يهمس من العتمة...</p>
          <h2
            class="glitch"
            id="welcome-text"
            data-text=""
            style="margin-top: 18px"></h2>
          <p
            class="muted"
            id="group-name"
            style="margin-top: 10px; font-size: 18px"></p>
          <div class="spacer"></div>
          <button id="btn-continue" class="btn">تابع إلى الداخل</button>
        </div>
      </section>
    </div>

    <!-- صوت الخلفية: حط ملفاتك الصوتية في assets/sounds/ -->
    <audio id="bg-ambience" loop preload="auto">
      <source src="assets/sounds/ambience.mp3" type="audio/mpeg" />
    </audio>
    <audio id="bg-whispers" loop preload="auto">
      <source src="assets/sounds/whispers.mp3" type="audio/mpeg" />
    </audio>
    <audio id="sfx-break" preload="auto">
      <source src="assets/sounds/break.mp3" type="audio/mpeg" />
    </audio>

    <script type="module" src="js/landing.js"></script>
    <script type="module">
      import { startAutoUpdateWatcher } from "./js/version-check.js";
      startAutoUpdateWatcher();
    </script>
  </body>
</html>

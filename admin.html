<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الأدمن - عشيرة الظلام</title>
    <link rel="stylesheet" href="css/main.css" />
    <link
      rel="icon"
      href="assets/ChatGPT Image Jun 23, 2026, 01_26_16 PM.png" />
  </head>
  <body>
    <div class="vignette"></div>
    <div class="noise"></div>
    <div class="fire-bg">
      <div class="flame"></div>
      <div class="flame"></div>
      <div class="flame"></div>
      <div class="flame"></div>
      <div class="flame"></div>
      <div class="flame"></div>
    </div>

    <div class="wrap">
      <!-- بوابة الباسورد -->
      <section id="gate" class="fade-in">
        <h1 class="glitch" data-text="بوابة الأدمن">بوابة الأدمن</h1>
        <div class="card" style="margin-top: 24px">
          <label class="muted">باسورد الأدمن</label>
          <input
            id="admin-password"
            type="password"
            class="input"
            placeholder="••••••" />
          <button id="btn-gate" class="btn">دخول</button>
          <p
            id="gate-error"
            class="muted hidden"
            style="color: #ff5a5a; margin-top: 10px">
            باسورد غلط.
          </p>
        </div>
      </section>

      <!-- لوحة الأدمن -->
      <section id="panel" class="hidden">
        <h1 class="glitch" data-text="لوحة الأدمن">لوحة الأدمن</h1>

        <div
          class="row"
          style="
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 14px;
          ">
          <button class="btn ghost tab-btn" data-tab="tab-points">
            النقاط
          </button>
          <button class="btn ghost tab-btn" data-tab="tab-tasks">المهام</button>
          <button class="btn ghost tab-btn" data-tab="tab-users">
            المستخدمين
          </button>
          <button class="btn ghost tab-btn" data-tab="tab-settings">
            الإعدادات
          </button>
        </div>

        <!-- تاب النقاط -->
        <div id="tab-points" class="tab fade-in" style="margin-top: 26px">
          <div class="card">
            <label class="muted">اختر المجموعة</label>
            <select id="group-select" class="input"></select>

            <p class="muted" style="margin-top: 14px">
              السكور الحالي: <span id="current-score">--</span>
            </p>

            <div
              id="shapes-buttons"
              class="grid grid-3"
              style="margin-top: 14px"></div>

            <div class="row" style="margin-top: 20px">
              <input
                id="custom-points"
                type="number"
                class="input"
                placeholder="نقاط مخصصة (+/-)" />
              <button
                id="btn-custom-points"
                class="btn"
                style="width: auto; white-space: nowrap">
                تطبيق
              </button>
            </div>
          </div>

          <h2 style="margin-top: 36px">كل المجموعات</h2>
          <table id="groups-table">
            <thead>
              <tr>
                <th>المجموعة</th>
                <th>السكور</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <!-- تاب المهام -->
        <div id="tab-tasks" class="tab hidden" style="margin-top: 26px">
          <div class="card">
            <h2>إضافة مهمة جديدة</h2>
            <input
              id="task-title"
              class="input"
              placeholder="عنوان المهمة"
              style="margin-top: 10px" />
            <input
              id="task-password"
              class="input"
              placeholder="الباسورد"
              style="margin-top: 10px" />
            <textarea
              id="task-content"
              class="input"
              rows="3"
              placeholder="المحتوى/الموقع اللي يظهر بعد الفتح"
              style="margin-top: 10px"></textarea>
            <input
              id="task-order"
              type="number"
              class="input"
              placeholder="الترتيب (رقم)"
              style="margin-top: 10px" />
            <button id="btn-add-task" class="btn">إضافة</button>
          </div>

          <h2 style="margin-top: 30px">المهام الحالية</h2>
          <div id="tasks-admin-list"></div>
        </div>

        <!-- تاب المستخدمين -->
        <div id="tab-users" class="tab hidden" style="margin-top: 26px">
          <div class="card">
            <h2>إضافة مستخدم جديد</h2>
            <input
              id="user-name"
              class="input"
              placeholder="اسم المستخدم"
              style="margin-top: 10px" />
            <input
              id="user-group"
              class="input"
              placeholder="اسم المجموعة/التيم"
              style="margin-top: 10px" />
            <select id="user-role" class="input" style="margin-top: 10px">
              <option value="user">يوزر عادي</option>
              <option value="leader">ليدر</option>
              <option value="admin">أدمن</option>
            </select>
            <button id="btn-add-user" class="btn">إضافة</button>
          </div>

          <h2 style="margin-top: 30px">المستخدمين الحاليين</h2>
          <table id="users-table">
            <thead>
              <tr>
                <th>الاسم</th>
                <th>المجموعة</th>
                <th>الدور</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <!-- تاب الإعدادات -->
        <div id="tab-settings" class="tab hidden" style="margin-top: 26px">
          <div class="card">
            <h2>عتبات المؤشر</h2>
            <label class="muted">من كذا فأعلى = أخضر</label>
            <input id="setting-green" type="number" class="input" />
            <label class="muted" style="margin-top: 10px; display: block"
              >من كذا فأقل = أحمر</label
            >
            <input id="setting-red" type="number" class="input" />

            <h2 style="margin-top: 24px">أشكال النقاط (3 أشكال)</h2>
            <div id="shapes-settings"></div>

            <button id="btn-save-settings" class="btn" style="margin-top: 18px">
              حفظ الإعدادات
            </button>
          </div>
        </div>

        <div class="center" style="margin-top: 34px">
          <button id="btn-logout" class="btn ghost">خروج</button>
        </div>
      </section>
    </div>

    <div id="toast-container"></div>

    <audio id="bg-ambience" loop preload="auto">
      <source src="assets/sounds/ambience.mp3" type="audio/mpeg" />
    </audio>

    <script type="module" src="js/admin.js"></script>
    <script type="module">
      import { startAutoUpdateWatcher } from "./js/version-check.js";
      startAutoUpdateWatcher();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المؤشر - عشيرة الظلام</title>
<link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="assets/ChatGPT Image Jun 23, 2026, 01_26_16 PM.png" />

</head>
<body>

  <div class="vignette"></div>
  <div class="noise"></div>
  <div class="fire-bg">
    <div class="flame"></div><div class="flame"></div><div class="flame"></div>
    <div class="flame"></div><div class="flame"></div><div class="flame"></div>
  </div>

    <button id="btn-notifications" class="notify-btn">التنبيهات</button>

    <div id="notifications-overlay" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,.78); z-index:250; display:flex; align-items:center; justify-content:center; padding:20px;">
      <div class="card notifications-panel reveal-pop">
        <div class="row" style="justify-content:space-between; gap:12px;">
          <h2 style="margin:0;">التنبيهات</h2>
          <button id="notifications-close" class="btn ghost compact-btn">إغلاق</button>
        </div>
        <div id="notifications-list" style="margin-top:16px;"></div>
      </div>
    </div>

  <div class="wrap">
    <h1 id="page-title" class="glitch" data-text="المؤشر">المؤشر</h1>
    <p class="subtitle" id="user-sub">جاري التحميل...</p>

    <div class="card fade-in" style="margin-top:26px;">
      <div class="indicator-wrap">
        <div class="indicator-track" id="track">
          <div class="indicator-glow"></div>
          <div class="indicator-marker" id="marker" style="bottom:50%;"></div>
        </div>
        <div class="indicator-label red" id="indicator-label">أحمر</div>
      </div>
    </div>

    <div class="center" style="margin-top:30px;">
      <button id="btn-logout" class="btn ghost">خروج</button>
    </div>
  </div>

  <audio id="bg-ambience" loop preload="auto" autoplay>
    <source src="assets/sounds/ambience.mp3" type="audio/mpeg">
  </audio>

  <script type="module" src="js/notifications.js"></script>
  <script type="module" src="js/user.js"></script>
  <script type="module" src="js/admin-back-btn.js"></script>
  <script type="module">
    import { startAutoUpdateWatcher } from "./js/version-check.js";
    startAutoUpdateWatcher();
  </script>
</body>
</html>
